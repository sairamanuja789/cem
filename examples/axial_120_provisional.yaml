# PROVISIONAL exploratory duty variant of examples/axial_120.yaml (ADR-019, accepted 2026-10-12).
# The duty is INFERRED from public manufacturer data (ebm-papst 4412 F curve scaled to 2000 rpm with
# the fan laws; Delta p_f read as fan static: HI-032, inferred, not manufacturer-confirmed). It is
# NOT a requirement, NOT a measurement and NOT manufacturer-equivalent: design searches may target
# it, but no result may be described as validated or guaranteed. It is replaced by a measured
# target if a reference fan is ever tested (HI-025, deferred). Everything else matches
# examples/axial_120_trial.yaml.
schema_version: "1.0.0"
spec_id: axial-120-provisional
revision: 1
parent: null
family: fans.axial_ducted
title: 120 mm ducted axial fan (PROVISIONAL duty, public data)

air:  # AX-005
  density: {value: 1.18, unit: kg/m3, provenance: default}
  temperature: {value: 298.15, unit: K, provenance: default}

manufacturing:  # AX-006, AX-007
  process: {value: FDM, provenance: user}
  material:
    value: PETG
    provenance: default
    provisional: true
    note: Replace with the material actually used; strength values need coupon tests.

