[build-system]
# T11 (ADR-013): scikit-build-core builds the nanobind module cemkit._kernel with CMake. Both are
# pre-approved in docs/build-plan.md (T11) and pinned exactly; both releases predate the
# exclude-newer date below (nanobind 3.1.0: 2026-09-18, scikit-build-core 1.0.3: 2026-07-12).
requires = ["scikit-build-core==1.0.3", "nanobind==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "cemkit"
version = "0.0.0"
description = "cemkit: CEM platform orchestration layer"
requires-python = ">=3.13,<3.14"
dependencies = [
  "jsonschema",
  "pyyaml",
  "typer",
]

[dependency-groups]
dev = [
  "gcovr",
  "hypothesis",
  "mypy",
  "nanobind==3.1.0",  # T11: the release preset builds cemkit._kernel against it (ADR-013)
  "pytest",
  "pytest-cov",
  "ruff",
  "types-jsonschema",
  "types-pyyaml",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.28"
cmake.build-type = "Release"
ninja.make-fallback = false
# Persistent build tree, so wheel rebuilds are incremental (with ccache).
build-dir = "build/python/{wheel_tag}"
# Only the extension and what it links; the kernel tests are built by the CMake presets.
build.targets = ["_kernel"]
install.components = ["python"]
wheel.packages = ["python/cemkit"]
editable.mode = "redirect"

[tool.uv]
default-groups = ["dev"]
# REPRO-002 / 14-day rule: resolve only versions published before this date (see docs/toolchain.md).
exclude-newer = "2026-09-25T00:00:00Z"
# The dev venv does not build or install cemkit (ADR-013): `uv run` must never compile the kernel
# (it runs on the host too, e.g. the edit hook). The tests import python/ (pytest pythonpath), and
# the release preset builds cemkit._kernel into python/cemkit/. Wheels still build with
# scikit-build-core (`uv build`, check.sh stage "wheel").
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["python", "tests"]
extend-exclude = [".cache", "build", "vcpkg_installed"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["cemkit"]

[tool.mypy]
strict = true
mypy_path = "python:scripts:tests/python"
files = ["python", "tests/python", "scripts"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]
markers = ["req(id): the requirement ID this test verifies (for example SPEC-004)"]
pythonpath = ["python"]

[tool.coverage.run]
source = ["python/cemkit"]
branch = true

[tool.coverage.report]
show_missing = true
