# MAINT-003 (spec v1.2): line coverage of the platform core, spec and physics modules and of every
# product domain's physics (products/*/common and each family's L1 model). The 90% floor is applied by
# scripts/check.sh (--fail-under-line 90) once those modules contain code. Must match scripts/lib/coverage.sh.
root = .
filter = kernel/cemkit/(core|spec|physics)/
filter = kernel/products/[^/]+/common/
filter = kernel/products/[^/]+/families/[^/]+/l1_model
exclude = .*/tests/
gcov-executable = gcov-13
print-summary = yes
