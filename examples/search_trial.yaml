# EXPLORATORY SEARCH FOR THE TRIAL DUTY (M6, OPT-006). `cemkit optimize fan axial-120-trial
# examples/fan_design_trial.yaml THIS examples/cfd_trial.yaml`. A full factorial of the values below
# (deterministic, OPT-003), each candidate designed by L1 and simulated by CFD at the duty; only
# trusted (CONVERGED) candidates that reach the duty's total pressure are ranked. The hub radius is
# a placeholder until the motor is measured (HI-025). Candidates outside the docs/architecture.md
# section 5 bounds (solidity 0.4-1.5 at hub, mid and tip; hub-to-tip 0.30-0.60; 3-11 blades) are
# recorded as out_of_bounds and not simulated. SI units.
variables:
  r_hub: [0.024]                 # placeholder (hub ratio 0.40) until the motor is measured
  blade_count: [7]               # ADR-016 initial design (bounds 3-11)
  solidity_hub: [1.0, 1.4]       # chord = solidity 2 pi r / Z (architecture section 5: 0.4-1.5)
  solidity_tip: [0.5, 0.8]       # the base trial chord gives 0.30, outside the bounds
  camber_scale: [1.5, 2.0, 2.5]  # multiplies the zero-deviation camber (a design variable, not a
                                 # deviation model: CFD at the free-vortex camber under-turns)
objective: total_to_static_efficiency   # maximised (AX-011; OPT-001: physical, dimensionless)
max_candidates: 12                      # OPT-005 budget
