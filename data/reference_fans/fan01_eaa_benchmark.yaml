test_setup:                      # LA_Case4_AxialFan_measurements.pdf
  standard: "ISO 5801:2007, standardized inlet test chamber; flow from a standardized bellmouth inlet"
  installation: "short duct (390 mm) with inlet nozzle and outlet diffuser; duct diameter 500 mm"
  drive: "motor outside the duct; torque and speed from a precision torque meter"
  rotation: clockwise (as stated in the PDF; viewing direction not stated)
configuration:
  rotor_only: true
  blade_count: {value: 9, source: "LDA and beamforming figures; 9-fold symmetric surface groups in cad_model.igs"}
  speed: {value: 1500, unit: rpm, status: inferred, note: "from the stated blade-passing frequency 225 Hz with 9 blades; the speed is not given in the dataset files examined; confirm from the SAE paper (HI-034)"}
  duct_diameter: {value: 500, unit: mm, source: "measurement PDF, figure 1"}
  tip_radius_from_cad: {value: 247.50, unit: mm, source: "max vertex radius of the rotor surfaces in cad_model.igs (FreeCAD 1.1.1)"}
  hub_radius_from_cad: {min: 118.0, max: 127.0, unit: mm, note: "hub-region vertex radii; the hub is an open surface"}
  tip_gap: {value: null, status: UNKNOWN, note: "duct surfaces sampled in the rotor span reach r = 247.17 mm, inside the 247.50 mm tip: an extraction artefact or a geometry issue; to be resolved from the CAD or the SAE paper (HI-034)"}
characteristic:                  # characteristic.zip / characteristic_n1ug.mat (MATLAB 5, 2015-12-04)
  pressure_definition: "total-to-static pressure difference Delta p_ts (ISO 5801 inlet chamber); the file stores it as p_chamber_static_in_Pa, the chamber static pressure relative to ambient (annotations.txt), as a positive magnitude"
  columns: [flow_m3_per_s, delta_p_ts_pa, shaft_power_w]
  power_column_note: "the file names it P_shaft_in_Nm, but the values are watts: Q x Delta p_ts / P reproduces the PDF's eta_ts = 53 % at 1.4 m3/s (recorded discrepancy)"
  uncertainty: {value: null, status: UNKNOWN, note: "not stated in the dataset; a round-robin study (TU Darmstadt, three printed copies) reports high repeatability and good reproducibility at the design point and deviations in stall; figures to be extracted (HI-034)"}
  design_flow: {value: 1.4, unit: m3/s, eta_ts_percent: 53, source: "measurement PDF"}
  stall_note: "a plateau and dip near 0.8-1.2 m3/s (stall onset; acoustic rise at 1.1 m3/s per the PDF)"
