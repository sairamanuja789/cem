# FAN-01 (EAA benchmark): low-pressure axial fan in a short duct. Open research dataset used to
# check the credibility of the CFD *workflow* (ADR-020, proposed). It is not our fan: agreement here
# does not validate our design or close Gate 1 (architecture: "first fan validated ... with rig
# data"), and its chord Reynolds number is about 10x or more above our fan's.
